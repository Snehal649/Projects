# Run only MySQL:   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: fintrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fintrack
    ports:
      - "3306:3306"
    volumes:
      - fintrack-data:/var/lib/mysql
volumes:
  fintrack-data:
