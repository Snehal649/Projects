spring.application.name=fintrack
server.port=${PORT:8080}

# Local default works with your own MySQL. On Render, set the DB_URL / DB_USER / DB_PASS environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.format.date=iso
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT secret must be at least 32 characters. Set JWT_SECRET on Render.
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
app.jwt.expiration-ms=86400000

# Frontend URL allowed to call the API (no trailing slash). Set CORS_ORIGIN on Render.
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
